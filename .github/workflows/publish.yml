name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish blnk-python
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PKG_VERSION}"
            exit 1
          fi

      - name: Verify package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import pathlib
          import tomllib

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          errors = []

          if project["name"] != "blnk-python":
              errors.append(f"unexpected package name: {project['name']}")
          if not pathlib.Path("blnk_sdk").is_dir():
              errors.append("missing blnk_sdk package directory")
          if not pathlib.Path("README.md").is_file():
              errors.append("missing README.md")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              raise SystemExit(1)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Run unit tests
        run: |
          python -m pip install '.[dev]'
          pytest tests/unit

      - name: Build package
        run: python -m build

      - name: Verify distribution files
        run: twine check dist/*

      - name: Smoke test packed distribution
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="${GITHUB_WORKSPACE}/$(ls -1 dist/blnk_python-*.whl | head -1)"
          python -m venv "${GITHUB_WORKSPACE}/smoke-test-venv"
          source "${GITHUB_WORKSPACE}/smoke-test-venv/bin/activate"
          python -m pip install "$WHEEL"
          python -c "from blnk_sdk import BlnkClientOptions, blnk_init; print('smoke test ok')"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
